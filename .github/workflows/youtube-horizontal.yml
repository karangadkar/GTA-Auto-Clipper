name: YouTube 1080p - all clips
run-name: Full 1080p entertainment edit - ${{ github.run_number }}
'on':
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare free standard Linux media tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
          ffmpeg -version | head -n 1
      - name: Render all twelve clips with transitions and sound effects
        env:
          VIDEO_EDIT_BUNDLE: ${{ secrets.VIDEO_EDIT_BUNDLE_1080P }}
        run: python tools/youtube_horizontal.py
      - name: Save completed video and edit report
        uses: actions/upload-artifact@v4
        with:
          name: edited-youtube-1080p
          path: exports/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
