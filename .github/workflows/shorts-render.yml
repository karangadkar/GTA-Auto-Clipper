name: Shorts render without transcription
run-name: Three Shorts - no transcription - ${{ github.run_number }}
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Captured source excerpts ZIP containing manifest.json and three MP4 files
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      BUNDLE_URL: ${{ inputs.bundle_url }}
      CLIPKARO_ROOT: ClipKaro
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: karangadkar/ClipKaro
          path: ClipKaro
          persist-credentials: false
      - name: Check native media tools, no pip or ASR models
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
      - name: Render three verified vertical MP4s, without transcribing speech
        run: python3 tools/shorts_render.py
      - name: Save completed MP4s and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: completed-shorts-${{ github.run_id }}
          path: exports/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
