name: Shorts analysis and render
run-name: Shorts ${{ inputs.mode }} - ${{ github.run_number }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Analyze, render, or transcribe captured audio with ClipKaro
        type: choice
        options: [analyze, render, transcribe]
        default: analyze
        required: true
      source_url:
        description: Source URL or captured audio file URL for transcription
        type: string
        required: true
      window_start:
        description: Source start in seconds, or -1 for latest completed window
        type: string
        default: '-1'
      analysis_run_id:
        description: Analysis run ID for rendering
        type: string
        default: ''
      edit_json:
        description: Reviewed edits or captured-window metadata
        type: string
        default: '{}'
permissions:
  contents: read
  actions: read
jobs:
  transcribe:
    if: inputs.mode == 'transcribe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_XET: '1'
      OMP_NUM_THREADS: '3'
      OPENBLAS_NUM_THREADS: '1'
      SOURCE_URL: ${{ inputs.source_url }}
      WINDOW_JSON: ${{ inputs.edit_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: karangadkar/ClipKaro
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only ClipKaro transcription dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy<3' 'faster-whisper==1.2.1' 'av>=14,<16' soundfile requests
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Transcribe captured Hindi audio with actual ClipKaro modules
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          from clipper.fetch import transcribe, sentences
          out = pathlib.Path('transcription_output')
          out.mkdir(exist_ok=True)
          with urllib.request.urlopen(os.environ['SOURCE_URL'], timeout=60) as response, open('captured_audio.m4a', 'wb') as target:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  target.write(chunk)
          subprocess.run(['ffmpeg', '-hide_banner', '-loglevel', 'error', '-y', '-i', 'captured_audio.m4a', '-ac', '1', '-ar', '16000', 'captured_audio.wav'], check=True)
          context = json.loads(os.environ.get('WINDOW_JSON', '{}'))
          model = context.get('asr_model', 'base')
          language = context.get('language', 'hi')
          words, detected_language, used_model, device = transcribe(pathlib.Path('captured_audio.wav'), model, language, 'cpu', beam=1)
          lines = sentences(words)
          (out / 'words.json').write_text(json.dumps(words, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'sentences.json').write_text(json.dumps(lines, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'window.json').write_text(json.dumps(context, ensure_ascii=False, indent=2), encoding='utf-8')
          (out / 'asr_metadata.json').write_text(json.dumps({'framework':'ClipKaro','language':detected_language,'model':used_model,'device':device,'words':len(words)}, indent=2))
          (out / 'transcript.txt').write_text('\n'.join(f"[{line['s']:.2f}-{line['e']:.2f}] {line['text']}" for line in lines), encoding='utf-8')
          print(f'ClipKaro transcription complete: {len(words)} words, {len(lines)} lines.')
          PY
      - name: Preserve transcript for review, never publish a video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clipkaro-transcript-${{ github.run_id }}
          path: transcription_output/
          retention-days: 1
          if-no-files-found: warn
  shorts:
    if: inputs.mode != 'transcribe'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      SOURCE_URL: ${{ inputs.source_url }}
      WINDOW_START: ${{ inputs.window_start }}
      EDIT_JSON: ${{ inputs.edit_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free media tools
        run: |
          python -m pip install --disable-pip-version-check 'yt-dlp[default]' requests
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-dejavu-core
          fi
          ffmpeg -version | head -n 1
          node --version
      - name: Check source availability before heavy setup
        if: inputs.mode == 'analyze'
        run: python tools/shorts_render.py probe --url "$SOURCE_URL" --work work
      - name: Install CPU transcription and image packages
        run: python -m pip install --disable-pip-version-check 'numpy<3' Pillow 'opencv-python-headless>=4.10,<5' 'faster-whisper==1.2.1' 'av>=14,<16' chat-downloader
      - name: Analyze fixed source window and viewer reactions
        if: inputs.mode == 'analyze'
        run: python tools/shorts_render.py analyze --url "$SOURCE_URL" --start "$WINDOW_START" --work work
      - name: Restore reviewed analysis assets
        if: inputs.mode == 'render'
        uses: actions/download-artifact@v4
        with:
          name: shorts-analysis-${{ inputs.analysis_run_id }}
          run-id: ${{ inputs.analysis_run_id }}
          github-token: ${{ github.token }}
          path: work/restored
      - name: Render reviewed Shorts and validate exports
        if: inputs.mode == 'render'
        run: python tools/shorts_render.py render --url "$SOURCE_URL" --work work
      - name: Save analysis and diagnostic files
        if: always() && inputs.mode == 'analyze'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-analysis-${{ github.run_id }}
          path: work/artifacts/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
      - name: Save finished MP4s and ZIP
        if: success() && inputs.mode == 'render'
        uses: actions/upload-artifact@v4
        with:
          name: completed-shorts-${{ github.run_id }}
          path: work/exports/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
